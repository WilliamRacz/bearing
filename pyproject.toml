[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing"
version = "0.1.0"
description = "Keep AI-built projects pointed at what you set out to build."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
bearing = "bearing.__main__:main"

[tool.setuptools]
packages = ["bearing"]

[tool.setuptools.package-data]
bearing = ["web/*.html"]
